name: Check website
on:
  push:
    branches: [main, rebuild-20261106]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run build
      - run: P10X_CHECK_ROOT=dist npm run check
      - run: php -l contact.php
      - run: php -l comment.php
