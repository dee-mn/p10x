name: Copy original media
on:
  push:
    paths: [tools/original-assets-transfer.json, .github/workflows/original-assets.yml]
    branches: [main]
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy and verify original bytes
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, hashlib
          for asset in json.loads(pathlib.Path('tools/original-assets-transfer.json').read_text()):
              target=pathlib.Path(asset['path'])
              assert str(target).startswith('assets/') and '..' not in target.parts
              target.parent.mkdir(parents=True,exist_ok=True)
              subprocess.run(['curl','-fsSL','--retry','2','--max-time','120',asset['url'],'-o',str(target)],check=True)
              assert hashlib.sha256(target.read_bytes()).hexdigest()==asset['sha256'], str(target)
              print('Verified',target)
          PY
      - name: Save original media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m 'Add original reference media and local interface fonts'
            git push origin HEAD:main
          fi
